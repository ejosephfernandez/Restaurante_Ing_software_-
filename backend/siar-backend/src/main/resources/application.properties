# ========================================
# SIAR - Configuracion de la aplicacion
# ========================================

spring.application.name=siar-backend

# ========================================
# Conexion a MySQL
# ========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/siar}
spring.datasource.username=${DB_USERNAME:siar_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# Piscina de conexiones HikariCP
# ========================================

spring.datasource.hikari.pool-name=SIAR-HikariPool
#Como máximo, la piscina mantendrá diez conexiones.
spring.datasource.hikari.maximum-pool-size=10  
#Intenta mantener dos conexiones inactivas disponibles.
spring.datasource.hikari.minimum-idle=2
#Espera hasta 30 segundos para obtener una conexión de la piscina.
spring.datasource.hikari.connection-timeout=30000
#Tiempo de inactividad antes de retirar conexiones ociosas que excedan el mínimo.
spring.datasource.hikari.idle-timeout=600000
#Vida máxima de una conexión: 30 minutos.
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# Configuracion de JPA
# ========================================

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false