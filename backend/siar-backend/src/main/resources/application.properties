# ========================================
# SIAR - Configuracion de la aplicacion
# ========================================

spring.application.name=siar-backend

# ========================================
# Conexion a MySQL
# ========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/siar}
spring.datasource.username=${DB_USERNAME:siar_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# Piscina de conexiones HikariCP
# ========================================

spring.datasource.hikari.pool-name=SIAR-HikariPool
#Como máximo, la piscina mantendrá diez conexiones.
spring.datasource.hikari.maximum-pool-size=10  
#Intenta mantener dos conexiones inactivas disponibles.
spring.datasource.hikari.minimum-idle=2
#Espera hasta 30 segundos para obtener una conexión de la piscina.
spring.datasource.hikari.connection-timeout=30000
#Tiempo de inactividad antes de retirar conexiones ociosas que excedan el mínimo.
spring.datasource.hikari.idle-timeout=600000
#Vida máxima de una conexión: 30 minutos.
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# Configuracion de JPA
# ========================================

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ========================================
# Seguridad JWT
# ========================================

# Clave secreta para firmar los tokens (HS256). Minimo 32 caracteres.
siar.jwt.secret=${JWT_SECRET:}
# Tiempo de vida del token en minutos.
siar.jwt.expiracion-minutos=${JWT_EXPIRATION_MINUTES:480}
# Origen permitido para CORS (frontend React).
siar.cors.origen-permitido=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Usuario administrador inicial: se crea solo si la tabla USUARIO esta vacia
# y se definio SIAR_ADMIN_PASSWORD.
siar.admin.usuario=${SIAR_ADMIN_USER:admin}
siar.admin.correo=${SIAR_ADMIN_EMAIL:admin@siar.local}
siar.admin.contrasena=${SIAR_ADMIN_PASSWORD:}
