$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuario": "{{admin_usuario}}",
      "contrasena": "clave-incorrecta"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Mensaje generico', () => pm.expect(pm.response.json().mensaje).to.eql('Usuario o contrasena incorrectos'));
    language: text/javascript
order: 3000
