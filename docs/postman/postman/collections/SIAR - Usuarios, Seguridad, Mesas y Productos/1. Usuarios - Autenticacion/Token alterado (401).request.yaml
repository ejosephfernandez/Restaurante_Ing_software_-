$kind: http-request
description: Una firma invalida debe ser rechazada.
url: "{{baseUrl}}/api/categorias"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_alterado}}"
scripts:
  - type: beforeRequest
    code: |-
      // Firma invalida a proposito: se agrega texto al final del token del admin
      pm.environment.set('token_alterado', pm.environment.get('token_admin') + 'alterado');
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 8000
