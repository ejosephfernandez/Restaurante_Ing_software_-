$kind: http-request
description: Comprueba que el cambio de estado quedó guardado.
url: "{{baseUrl}}/api/mesas/{{id_mesa_prueba}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_admin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Consulta de verificación responde 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('La mesa quedó OCUPADA', () => pm.expect(body.estado).to.eql('OCUPADA'));
    language: text/javascript
order: 10000
