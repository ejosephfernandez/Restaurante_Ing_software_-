$kind: http-request
description: Consulta los productos asociados a la categoría creada para esta prueba.
url: "{{baseUrl}}/api/productos/categoria/{{id_categoria_producto}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_admin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Consulta por categoría responde 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('La respuesta es un arreglo', () => pm.expect(body).to.be.an('array'));
      pm.test('Incluye el producto asociado a la categoría', () => pm.expect(body.some(p => String(p.idProducto) === pm.environment.get('id_producto_prueba'))).to.eql(true));
    language: text/javascript
order: 7000
