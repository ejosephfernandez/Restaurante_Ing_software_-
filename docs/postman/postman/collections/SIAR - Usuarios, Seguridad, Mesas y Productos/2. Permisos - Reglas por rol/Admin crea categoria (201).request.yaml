$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{categoria_nombre}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{token_admin}}"
scripts:
  - type: beforeRequest
    code: pm.environment.set('categoria_nombre', 'Categoria prueba ' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.environment.set('id_categoria', pm.response.json().idCategoria);
    language: text/javascript
order: 2000
