$kind: http-request
description: Crear, editar y desactivar menu es solo para ADMINISTRADOR.
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "No deberia crearse"
    }
auth:
  type: bearer
  credentials:
    token: "{{token_mesero}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403', () => pm.response.to.have.status(403));
      pm.test('Acceso denegado', () => pm.expect(pm.response.json().error).to.eql('Acceso denegado'));
    language: text/javascript
order: 4000
